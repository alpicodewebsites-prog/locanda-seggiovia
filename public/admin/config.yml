# Sveltia CMS — configurazione della Locanda Seggiovia
#
# Ogni collezione qui sotto corrisponde a una collezione di Astro definita in
# src/content.config.ts. I nomi dei campi devono restare allineati: se si
# rinomina un campo da una parte sola, il sito smette di compilare.
#
# NON modificare `repo` a mano se non dopo aver creato il repository GitHub.
# Il valore va scritto nella forma  utente/nome-repository

backend:
  name: github
  repo: alpicodewebsites-prog/locanda-seggiovia
  branch: main
  # Il pannello è servito da Vercel, ma il login passa da Netlify. Netlify
  # riconosce il sito dal dominio: senza questa riga non capisce per quale sito
  # sta autorizzando l'accesso e rifiuta la richiesta.
  site_domain: locanda-seggiovia.netlify.app
  # Si accede SOLO con token. Il pulsante «Accedi con GitHub» (OAuth via Netlify)
  # non funziona su questo progetto: mostrarlo confonderebbe la proprietaria, che
  # non saprebbe perché quel percorso non porta da nessuna parte.
  # Se un domani si sistema l'OAuth, basta rimettere: [oauth, token]
  auth_methods: [token]

# --- Cartelle dei file multimediali -----------------------------------------
# Le immagini stanno TUTTE in src/assets: da lì Astro le ottimizza (WebP e
# versioni ridimensionate), quindi il sito resta leggero.
# Il pannello deve puntare a quella stessa cartella, altrimenti la libreria
# appare vuota e la proprietaria non può sostituire nessuna fotografia.
#
# `public_folder` non è un indirizzo raggiungibile: serve solo a comporre il
# valore salvato nei file di contenuto. Le pagine ne estraggono il nome del
# file e risolvono l'immagine da src/assets.
media_folder: src/assets
public_folder: /assets

# --- Immagini caricate ------------------------------------------------------
#
# PERCHÉ LA CONVERSIONE IN WEBP È DISATTIVATA — leggere prima di riattivarla.
#
# Sveltia sa convertire le immagini in WebP dentro il browser al caricamento
# (opzione `media_libraries.all.transformations.raster_image`). Sembrava un
# miglioramento, e invece rende IMPOSSIBILE sostituire una fotografia:
#
#   1. la proprietaria carica un JPEG per sostituire `hero-piccole-dolomiti.jpg`;
#   2. Sveltia lo converte in WebP prima di salvarlo;
#   3. a quel punto prova a sostituire un file JPEG con un file WebP;
#   4. rifiuta, perché la sostituzione richiede lo stesso formato:
#      «Questo file non può sostituire … perché è in un formato diverso».
#
# In pratica: attivando la conversione, nessuna fotografia può più essere
# sostituita. Il pannello si blocca proprio nel gesto che serve alla cliente.
#
# Non esiste un'opzione documentata per disattivare il controllo di formato
# sulla sostituzione (verificato nella documentazione ufficiale, sezione
# «File field» e «Internal Media Storage»). Quindi si tiene la conversione
# spenta.
#
# Non si perde niente: **Astro converte comunque in WebP in fase di build**,
# quindi il sito pubblicato resta leggero. L'unico costo è che il repository
# conserva i file nel formato originale, un po' più pesanti.
media_libraries:
  # Limite al file caricabile: oltre, il pannello avvisa e rifiuta.
  # Questo non interferisce con la sostituzione e resta utile.
  default:
    config:
      max_file_size: 8388608 # 8 MB
      svg:
        optimize: true

# --- Output ------------------------------------------------------------------
output:
  # Fondamentale: se un campo opzionale resta vuoto, Sveltia non lo scrive nel
  # file. Senza questa riga scriverebbe una stringa vuota, che lo schema Zod
  # di Astro rifiuterebbe, facendo fallire la compilazione.
  omit_empty_optional_fields: true

# --- Interfaccia -------------------------------------------------------------
# NON aggiungere `locale: it`: Sveltia non supporta quell'opzione (è un residuo
# di Decap CMS) e la sua presenza fa fallire la lettura dell'intera
# configurazione, autenticazione compresa. L'interfaccia di Sveltia è già
# multilingua e segue la lingua del browser.

collections:
  # ==========================================================================
  # CAMERE E TARIFFE
  # ==========================================================================
  - name: camere
    label: Camere e tariffe
    label_singular: Camera
    description: >-
      Tipi di camera e relative tariffe. Le tariffe sono per persona, per giorno.
    folder: src/content/camere
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    preview_path: camere
    sortable_fields: [ordine, titolo]
    summary: '{{titolo}} — B&B {{tariffe.bnb}} €'
    fields:
      - { name: titolo, label: Nome della camera, widget: string }
      - name: ordine
        label: Ordine di comparsa
        widget: number
        default: 1
        hint: Numero più basso = compare prima nella pagina.
        value_type: int
        min: 0
      - name: descrizione
        label: Descrizione
        widget: text
        hint: Due o tre righe. Descrive la camera, non la vende.
      - name: occupanti
        label: Numero di ospiti
        widget: string
        required: false
        hint: 'Esempio: 2 persone'
      - name: tariffe
        label: Tariffe (€ per persona, per giorno)
        widget: object
        fields:
          - { name: bnb, label: 'Solo pernottamento e colazione', widget: number, value_type: float }
          - { name: mezzaPensione, label: 'Mezza pensione', widget: number, value_type: float }
          - { name: pensioneCompleta, label: 'Pensione completa', widget: number, value_type: float }
      - name: servizi
        label: Servizi in camera
        label_singular: Servizio
        widget: list
        required: false
        hint: 'Un servizio per riga. Il Wi-Fi è negli spazi comuni, non in camera: non va elencato qui.'
      - name: foto
        label: Fotografia della camera
        widget: image
        accept: image/jpeg,image/png,image/webp,image/avif
        required: false
        hint: 'Facoltativa. Se manca, la camera compare senza foto.'

  # ==========================================================================
  # MENÙ DEL RISTORANTE
  # ==========================================================================
  - name: menu
    label: Menù del ristorante
    label_singular: Piatto
    description: >-
      I piatti del ristorante. Il prezzo si può lasciare vuoto: in quel caso il
      piatto compare senza cifra.
    folder: src/content/menu
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    preview_path: ristorante
    sortable_fields: [categoria, ordine, nome]
    summary: '{{nome}} — {{categoria}}'
    fields:
      - { name: nome, label: Nome del piatto, widget: string }
      - name: categoria
        label: Categoria
        widget: select
        options:
          - { value: antipasti, label: Antipasti }
          - { value: primi, label: Primi }
          - { value: secondi, label: Secondi }
          - { value: dolci, label: Dolci }
      - name: ordine
        label: Ordine dentro la categoria
        widget: number
        default: 1
        value_type: int
        min: 0
      - name: descrizione
        label: Descrizione
        widget: text
      - name: prezzo
        label: Prezzo (€)
        widget: number
        required: false
        value_type: float
        hint: Lasciare vuoto se il prezzo non è ancora definito.
      - name: specialita
        label: È una specialità della casa
        widget: boolean
        default: false
        hint: Le specialità vengono messe in evidenza nella pagina.
      - name: foto
        label: Fotografia del piatto
        widget: image
        accept: image/jpeg,image/png,image/webp,image/avif
        required: false
        hint: 'Facoltativa. Se c''e, il piatto compare anche in galleria.'

  # ==========================================================================
  # GNOCCHI CON LA FIORETA (contenuto singolo)
  # ==========================================================================
  - name: gnocchi
    label: Gnocchi con la Fioreta
    label_singular: Gnocchi con la Fioreta
    description: >-
      La pagina del piatto bandiera. È un contenuto unico: non se ne creano altri.
    folder: src/content/gnocchi
    extension: md
    format: frontmatter
    create: false
    slug: '{{slug}}'
    preview_path: gnocchi-con-la-fioreta
    fields:
      - { name: titolo, label: Titolo, widget: string }
      - name: sottotitolo
        label: Sottotitolo
        widget: string
        required: false
      - name: storia
        label: Storia del piatto
        widget: text
        hint: Da dove viene la fioreta e perché è legata a Recoaro.
      - name: ricetta
        label: Ricetta De.Co.
        label_singular: Ingrediente
        widget: list
        fields:
          - { name: ingrediente, label: Ingrediente, widget: string }
          - { name: quantita, label: Quantità, widget: string }
      - name: lavorazione
        label: Lavorazione
        label_singular: Fase
        widget: list
        fields:
          - { name: titolo, label: Titolo della fase, widget: string }
          - { name: testo, label: Descrizione, widget: text }
      - name: condimento
        label: Condimento
        widget: text
      - name: riconoscimenti
        label: Riconoscimenti
        label_singular: Riconoscimento
        widget: list
        required: false
        default: ['Denominazione Comunale di Origine — Comune di Recoaro Terme']
      - name: foto
        label: Fotografia del piatto finito
        widget: image
        accept: image/jpeg,image/png,image/webp,image/avif
        required: false
        hint: 'Facoltativa.'
      - name: fotoPreparazione
        label: Fotografia degli ingredienti
        widget: image
        accept: image/jpeg,image/png,image/webp,image/avif
        required: false
        hint: 'Facoltativa.'

  # ==========================================================================
  # SENTIERI  (i contenuti arrivano nella settimana 3)
  # ==========================================================================
  - name: sentieri
    label: Sentieri
    label_singular: Sentiero
    description: >-
      Gli itinerari escursionistici. Compilare solo i dati tecnici che si
      conoscono: i campi vuoti non compaiono nel sito.
    folder: src/content/sentieri
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    preview_path: sentieri
    sortable_fields: [ordine, nome]
    summary: '{{nome}} — {{difficolta}}'
    fields:
      - { name: nome, label: Nome del sentiero, widget: string }
      - name: ordine
        label: Ordine di comparsa
        widget: number
        default: 1
        value_type: int
        min: 0
      - name: sommario
        label: Sommario
        widget: text
        hint: Una o due righe, per gli elenchi.
      - name: descrizione
        label: Descrizione del percorso
        widget: text
      - name: difficolta
        label: Difficoltà CAI
        widget: select
        options:
          - { value: T, label: 'T — Turistico' }
          - { value: E, label: 'E — Escursionistico' }
          - { value: EE, label: 'EE — Escursionisti esperti' }
      - { name: distanza, label: Distanza, widget: string, required: false, hint: 'Esempio: 12 km (solo andata)' }
      - { name: dislivello, label: Dislivello, widget: string, required: false, hint: 'Esempio: 400-550 m' }
      - { name: durata, label: Durata, widget: string, required: false, hint: 'Esempio: 4 ore' }
      - { name: partenza, label: Punto di partenza, widget: string, required: false }
      - { name: segnavia, label: Segnaletica CAI, widget: string, required: false, hint: 'Esempio: CAI 151/144' }
      - name: immagine
        label: Fotografia di copertina
        widget: image
        accept: image/jpeg,image/png,image/webp,image/avif
        required: false
        hint: 'Facoltativa. Se manca, la scheda usa un segnaposto neutro.'

  # ==========================================================================
  # FOTO DELLE PAGINE
  # Le fotografie che non appartengono a una scheda ma a una pagina intera.
  # Sono tutte qui perche' la proprietaria abbia un posto solo dove cambiarle.
  # ==========================================================================
  - name: impostazioni
    label: Foto delle pagine
    description: >-
      Le fotografie di apertura e di sfondo delle pagine. Sostituendone una qui,
      cambia in tutto il sito dove compare.
    files:
      - name: sito
        label: Fotografie generali
        file: src/content/impostazioni/sito.md
        fields:
          - name: hero
            label: Apertura della home
            widget: image
            accept: image/jpeg,image/png,image/webp,image/avif
            required: false
            hint: 'La fotografia grande della prima schermata. Serve almeno 2500 pixel di larghezza.'
          - name: panorama
            label: Panorama (chiusura della home e pagina Sentieri)
            widget: image
            accept: image/jpeg,image/png,image/webp,image/avif
            required: false
            hint: 'Usata a tutta larghezza: serve una fotografia grande e orizzontale.'
          - name: locandaEsterno
            label: La locanda vista da fuori
            widget: image
            accept: image/jpeg,image/png,image/webp,image/avif
            required: false
            hint: 'Compare nella home, in La Locanda, in Camere e in Ristorante.'
          - name: locandaCucina
            label: Il tavolo di cucina
            widget: image
            accept: image/jpeg,image/png,image/webp,image/avif
            required: false
            hint: 'Ingredienti o preparazione. Compare in Camere e nella pagina degli gnocchi.'
          - name: montagne
            label: Le montagne (pagina Sentieri)
            widget: image
            accept: image/jpeg,image/png,image/webp,image/avif
            required: false
