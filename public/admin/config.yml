# ============================================================================
# Sveltia CMS — configurazione della Locanda Seggiovia
# ============================================================================
#
# COME È ORGANIZZATO QUESTO PANNELLO
#
# Due gruppi, nell'ordine in cui si usano:
#
#   1. LE PAGINE — una voce per ogni pagina del sito.
#   2. LE SCHEDE — gli elenchi: sentieri, camere, piatti del menù.
#
# ----------------------------------------------------------------------------
# PERCHÉ OGNI PAGINA HA DUE VOCI: «Testi e paragrafi» E «Fotografie»
#
# Sveltia chiama le cartelle della libreria immagini con il nome della voce:
# «Home Page › …». Con una voce sola, quella parola finiva anche nella libreria,
# dove si gestiscono SOLO fotografie, e si leggeva «Testi, paragrafi e foto».
# Fuorviante.
#
# Ora i testi e le fotografie stanno in due file distinti, e la libreria mostra
# «Home Page › Fotografie», che è quello che serve.
#
# ----------------------------------------------------------------------------
# LE IMMAGINI NON FINISCONO TUTTE INSIEME
#
# Ogni sezione ha la sua cartella, dichiarata con `media_folder`:
#
#     Home Page              -> src/assets/home/
#     Pagina La Locanda      -> src/assets/la-locanda/
#     Pagina Sentieri        -> src/assets/sentieri-pagina/
#     Gnocchi con la Fioreta -> src/assets/gnocchi/
#     Sentieri (elenco)      -> src/assets/sentieri/
#     Camere (elenco)        -> src/assets/camere/
#     Menù del ristorante    -> src/assets/ristorante/piatti/
#
# ----------------------------------------------------------------------------
# PERCHÉ I NOMI DEI FILE COMINCIANO CON UN NUMERO
#
# La libreria ordina i file PER NOME. Senza numeri, `facciata.jpg` veniva prima
# di `hero.jpg`: l'ordine non aveva niente a che vedere con quello della pagina.
# Il numero davanti fa sì che l'ordine nella libreria sia quello in cui le
# fotografie compaiono scorrendo il sito.
#
# Se si rinomina una fotografia, va aggiornato anche il percorso scritto nel
# file della voce «Fotografie»: se non corrisponde, la pagina resta senza foto.
#
# ATTENZIONE — `media_folder` di collezione e di voce DEVE iniziare con la barra
# (`/src/assets/...`): senza, Sveltia lo interpreta come percorso relativo alla
# cartella dei contenuti e i file finiscono nel posto sbagliato.
#
# ----------------------------------------------------------------------------
# PERCHÉ LA CONVERSIONE IN WEBP È DISATTIVATA — leggere prima di riattivarla.
#
# Sveltia sa convertire le immagini in WebP dentro il browser al caricamento
# (`media_libraries.all.transformations.raster_image`). Rende però IMPOSSIBILE
# sostituire una fotografia: si carica un JPEG per sostituire un JPEG, Sveltia
# lo converte in WebP, e a quel punto rifiuta la sostituzione perché il formato
# è diverso — «Questo file non può sostituire … perché è in un formato diverso».
# Non esiste un'opzione documentata per disattivare quel controllo.
#
# Non si perde niente: Astro converte comunque in WebP in fase di compilazione.
# ============================================================================

backend:
  name: github
  repo: alpicodewebsites-prog/locanda-seggiovia
  branch: main
  # Il pannello è servito da Vercel, ma il login passa da Netlify.
  site_domain: locanda-seggiovia.netlify.app
  # Si accede SOLO con token: il pulsante «Accedi con GitHub» non funziona su
  # questo progetto, e mostrarlo confonderebbe la proprietaria.
  auth_methods: [token]

# --- Cartella generale ------------------------------------------------------
# Vale come ripiego per i campi che non dichiarano una cartella propria.
media_folder: src/assets
public_folder: /assets

media_libraries:
  default:
    config:
      max_file_size: 8388608 # 8 MB: oltre, il pannello avvisa e rifiuta
      svg:
        optimize: true

output:
  # Se un campo opzionale resta vuoto, Sveltia non lo scrive nel file. Senza
  # questa riga scriverebbe una stringa vuota, che lo schema di Astro
  # rifiuterebbe, facendo fallire la compilazione del sito.
  omit_empty_optional_fields: true

# NON aggiungere `locale: it`: Sveltia non supporta quell'opzione e la sua
# presenza fa fallire la lettura dell'intera configurazione, autenticazione
# compresa. L'interfaccia segue già la lingua del browser.

# ============================================================================
collections:
  # ==========================================================================
  # 1. LE PAGINE
  # ==========================================================================

  # --------------------------------------------------------------------------
  # HOME PAGE
  # --------------------------------------------------------------------------
  - name: home
    label: Home Page
    description: I testi e le quattro fotografie della prima pagina del sito.
    files:
      # --- I testi ---------------------------------------------------------
      - name: testi
        label: Testi e paragrafi
        file: src/content/home/testi.md
        fields:
          - label: Titolo principale
            name: titolo
            widget: string
            hint: 'La frase grande della prima schermata. È testo vero, non un''immagine: resta leggibile e indicizzabile.'

          - label: Testo sotto il titolo
            name: sottotitolo
            widget: text
            hint: Due righe. Dice cosa si trova qui e a chi serve.

          - label: Descrizione per i motori di ricerca
            name: descrizione
            widget: text
            required: false
            hint: 'Non si vede in pagina: compare su Google e quando il sito viene condiviso in un messaggio.'

          - label: I due accessi dell'apertura
            name: accessi
            label_singular: Accesso
            widget: list
            required: false
            hint: 'Le due scelte in fondo alla prima schermata. Se la lista è vuota, tornano quelle predefinite (Dormire e Mangiare).'
            fields:
              - { label: Parola piccola sopra, name: etichetta, widget: string }
              - { label: Titolo, name: titolo, widget: string }
              - { label: Riga di spiegazione, name: nota, widget: string }
              - label: Dove porta
                name: collegamento
                widget: select
                options:
                  - { label: Camere, value: /camere }
                  - { label: Ristorante, value: /ristorante }
                  - { label: Gnocchi con la Fioreta, value: /gnocchi-con-la-fioreta }
                  - { label: Sentieri, value: /sentieri }
                  - { label: La Locanda, value: /la-locanda }
                  - { label: Contatti, value: /contatti }

          - label: Invito ai sentieri
            name: invitoSentieri
            widget: string
            hint: Il collegamento piccolo sotto i due accessi.

          - label: Testo del pulsante degli gnocchi
            name: pulsanteGnocchi
            widget: string
            hint: La scritta dentro il pulsante giallo a pillola.

          - { label: 'Sezione «La locanda» — etichetta piccola', name: locandaEtichetta, widget: string }
          - { label: 'Sezione «La locanda» — titolo', name: locandaTitolo, widget: string }
          - label: 'Sezione «La locanda» — paragrafi'
            name: locandaParagrafi
            label_singular: Paragrafo
            widget: list
            required: false
            hint: Un paragrafo per voce. Vanno a capo da soli.
          - { label: 'Sezione «La locanda» — testo del collegamento', name: locandaCollegamento, widget: string }
          - { label: 'Sezione «Territorio» — etichetta piccola', name: territorioEtichetta, widget: string }
          - { label: 'Sezione «Territorio» — titolo', name: territorioTitolo, widget: string }
          - { label: 'Sezione «Territorio» — introduzione', name: territorioTesto, widget: text }

      # --- Le fotografie ---------------------------------------------------
      - name: foto
        label: Fotografie
        file: src/content/home/foto.md
        media_folder: /src/assets/home
        public_folder: /assets/home
        fields:
          # L'ordine di questi campi è quello in cui le fotografie compaiono
          # scorrendo la pagina, e i numeri dei file seguono lo stesso ordine.
          - label: '1 — Apertura, prima schermata (orizzontale)'
            name: hero
            widget: image
            accept: image/jpeg,image/png,image/webp,image/avif
            required: false
            hint: 'La fotografia grande in cima, con il titolo sopra. Serve almeno 2500 pixel di larghezza. Se la togli, resta il fondo scuro.'
          - label: '2 — La locanda vista da fuori (orizzontale)'
            name: facciata
            widget: image
            accept: image/jpeg,image/png,image/webp,image/avif
            required: false
            hint: 'Nella sezione «La locanda» della home. La pagina La Locanda ha una sua fotografia, separata.'
          - label: '3 — Le montagne (orizzontale)'
            name: montagne
            widget: image
            accept: image/jpeg,image/png,image/webp,image/avif
            required: false
            hint: Nella sezione Territorio, accanto ai sentieri.
          - label: '4 — Fascia panoramica (orizzontale)'
            name: panorama
            widget: image
            accept: image/jpeg,image/png,image/webp,image/avif
            required: false
            hint: Usata a tutta larghezza, verso la fine della pagina.

  # --------------------------------------------------------------------------
  # PAGINA LA LOCANDA
  # --------------------------------------------------------------------------
  - name: pagina-locanda
    label: Pagina La Locanda
    description: Testi e fotografie della pagina «La locanda e la famiglia».
    files:
      - name: testi
        label: Testi e paragrafi
        file: src/content/la-locanda/testi.md
        fields:
          - { label: Titolo, name: titolo, widget: string }
          - { label: Testo introduttivo, name: sottotitolo, widget: text, required: false }

      - name: foto
        label: Fotografie
        file: src/content/la-locanda/foto.md
        media_folder: /src/assets/la-locanda
        public_folder: /assets/la-locanda
        fields:
          - label: '1 — Il tavolo di cucina (verticale)'
            name: cucina
            widget: image
            accept: image/jpeg,image/png,image/webp,image/avif
            required: false
            hint: Scatto verticale, accanto al racconto della famiglia.
          - label: '2 — La locanda vista da fuori (orizzontale)'
            name: facciata
            widget: image
            accept: image/jpeg,image/png,image/webp,image/avif
            required: false
            hint: 'Distinta da quella della home: puoi metterne una diversa.'

  # --------------------------------------------------------------------------
  # PAGINA SENTIERI
  # --------------------------------------------------------------------------
  - name: pagina-sentieri
    label: Pagina Sentieri
    description: Testi e fotografie dell'elenco dei sentieri.
    files:
      - name: testi
        label: Testi e paragrafi
        file: src/content/sentieri-pagina/testi.md
        fields:
          - { label: Titolo, name: titolo, widget: string }
          - { label: Testo introduttivo, name: sottotitolo, widget: text, required: false }

      - name: foto
        label: Fotografie
        file: src/content/sentieri-pagina/foto.md
        media_folder: /src/assets/sentieri-pagina
        public_folder: /assets/sentieri-pagina
        fields:
          # La cartella è `sentieri-pagina`, separata da `sentieri` che contiene
          # le copertine dei singoli itinerari: aprendo questi campi si vedono
          # solo le fotografie della pagina, non tutte quelle dei sentieri.
          - label: '1 — Le montagne (orizzontale)'
            name: montagne
            widget: image
            accept: image/jpeg,image/png,image/webp,image/avif
            required: false
          - label: '2 — Panorama (orizzontale)'
            name: panorama
            widget: image
            accept: image/jpeg,image/png,image/webp,image/avif
            required: false

  # --------------------------------------------------------------------------
  # GNOCCHI CON LA FIORETA
  # --------------------------------------------------------------------------
  - name: gnocchi
    label: Gnocchi con la Fioreta
    description: La pagina del piatto bandiera. È un contenuto unico.
    files:
      - name: testi
        label: Testi e ricetta
        file: src/content/gnocchi/testi.md
        fields:
          - { label: Titolo, name: titolo, widget: string }
          - { label: Sottotitolo, name: sottotitolo, widget: string, required: false }
          - label: Storia del piatto
            name: storia
            widget: text
            hint: Da dove viene la fioreta e perché è legata a Recoaro.
          - label: Ricetta De.Co.
            name: ricetta
            label_singular: Ingrediente
            widget: list
            fields:
              - { label: Ingrediente, name: ingrediente, widget: string }
              - { label: Quantità, name: quantita, widget: string }
          - label: Lavorazione
            name: lavorazione
            label_singular: Fase
            widget: list
            fields:
              - { label: Titolo della fase, name: titolo, widget: string }
              - { label: Descrizione, name: testo, widget: text }
          - { label: Condimento, name: condimento, widget: text }
          - label: Riconoscimenti
            name: riconoscimenti
            label_singular: Riconoscimento
            widget: list
            required: false

      - name: foto
        label: Fotografie
        file: src/content/gnocchi/foto.md
        media_folder: /src/assets/gnocchi
        public_folder: /assets/gnocchi
        fields:
          - label: '1 — Gli ingredienti (verticale)'
            name: fotoPreparazione
            widget: image
            accept: image/jpeg,image/png,image/webp,image/avif
            required: false
            hint: Scatto verticale del tavolo di cucina.
          - label: '2 — Il piatto finito (orizzontale)'
            name: foto
            widget: image
            accept: image/jpeg,image/png,image/webp,image/avif
            required: false
            hint: Scatto orizzontale del piatto impiattato.

  # ==========================================================================
  # 2. LE SCHEDE
  # ==========================================================================

  # --------------------------------------------------------------------------
  # SENTIERI
  # --------------------------------------------------------------------------
  - name: sentieri
    label: Sentieri (elenco)
    label_singular: Sentiero
    description: >-
      Gli itinerari escursionistici. Compilare solo i dati tecnici che si
      conoscono: i campi vuoti non compaiono nel sito.
    folder: src/content/sentieri
    media_folder: /src/assets/sentieri
    public_folder: /assets/sentieri
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    preview_path: sentieri
    sortable_fields: [ordine, nome]
    summary: '{{nome}} — {{difficolta}}'
    fields:
      - { label: Nome del sentiero, name: nome, widget: string }
      - label: Ordine di comparsa
        name: ordine
        widget: number
        default: 1
        value_type: int
        min: 0
      - label: Sommario
        name: sommario
        widget: text
        hint: Una o due righe, per gli elenchi.
      - { label: Descrizione del percorso, name: descrizione, widget: text }
      - label: Difficoltà CAI
        name: difficolta
        widget: select
        options:
          - { label: 'T — Turistico', value: T }
          - { label: 'E — Escursionistico', value: E }
          - { label: 'EE — Escursionisti esperti', value: EE }
      - { label: Distanza, name: distanza, widget: string, required: false, hint: 'Esempio: 12 km (solo andata)' }
      - { label: Dislivello, name: dislivello, widget: string, required: false, hint: 'Esempio: 400-550 m' }
      - { label: Durata, name: durata, widget: string, required: false, hint: 'Esempio: 4 ore' }
      - { label: Punto di partenza, name: partenza, widget: string, required: false }
      - { label: Segnaletica CAI, name: segnavia, widget: string, required: false, hint: 'Esempio: CAI 151/144' }
      - label: Fotografia di copertina
        name: immagine
        widget: image
        accept: image/jpeg,image/png,image/webp,image/avif
        required: false
        hint: 'Se manca, la scheda usa un segnaposto neutro.'

  # --------------------------------------------------------------------------
  # CAMERE
  # --------------------------------------------------------------------------
  - name: camere
    label: Camere (elenco)
    label_singular: Camera
    description: >-
      Tipi di camera e relative tariffe. Le tariffe sono per persona, per giorno.
    folder: src/content/camere
    media_folder: /src/assets/camere
    public_folder: /assets/camere
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    preview_path: camere
    sortable_fields: [ordine, titolo]
    summary: '{{titolo}} — B&B {{tariffe.bnb}} €'
    fields:
      - { label: Nome della camera, name: titolo, widget: string }
      - label: Ordine di comparsa
        name: ordine
        widget: number
        default: 1
        hint: Numero più basso = compare prima nella pagina.
        value_type: int
        min: 0
      - label: Descrizione
        name: descrizione
        widget: text
        hint: Due o tre righe. Descrive la camera, non la vende.
      - label: Numero di ospiti
        name: occupanti
        widget: string
        required: false
        hint: 'Esempio: 2 persone'
      - label: Tariffe (€ per persona, per giorno)
        name: tariffe
        widget: object
        fields:
          - { label: 'Solo pernottamento e colazione', name: bnb, widget: number, value_type: float }
          - { label: 'Mezza pensione', name: mezzaPensione, widget: number, value_type: float }
          - { label: 'Pensione completa', name: pensioneCompleta, widget: number, value_type: float }
      - label: Servizi in camera
        name: servizi
        label_singular: Servizio
        widget: list
        required: false
        hint: 'Un servizio per riga. Il Wi-Fi è negli spazi comuni, non in camera: non va elencato qui.'
      - label: Fotografia della camera
        name: foto
        widget: image
        accept: image/jpeg,image/png,image/webp,image/avif
        required: false
        hint: 'Facoltativa. Se manca, la camera compare senza foto.'

  # --------------------------------------------------------------------------
  # MENÙ DEL RISTORANTE
  # --------------------------------------------------------------------------
  - name: menu
    label: Menù del ristorante
    label_singular: Piatto
    description: >-
      I piatti del ristorante. Il prezzo si può lasciare vuoto: in quel caso il
      piatto compare senza cifra.
    folder: src/content/menu
    media_folder: /src/assets/ristorante/piatti
    public_folder: /assets/ristorante/piatti
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    preview_path: ristorante
    sortable_fields: [categoria, ordine, nome]
    summary: '{{nome}} — {{categoria}}'
    fields:
      - { label: Nome del piatto, name: nome, widget: string }
      - label: Categoria
        name: categoria
        widget: select
        options:
          - { label: Antipasti, value: antipasti }
          - { label: Primi, value: primi }
          - { label: Secondi, value: secondi }
          - { label: Dolci, value: dolci }
      - label: Ordine dentro la categoria
        name: ordine
        widget: number
        default: 1
        value_type: int
        min: 0
      - { label: Descrizione, name: descrizione, widget: text }
      - label: Prezzo (€)
        name: prezzo
        widget: number
        required: false
        value_type: float
        hint: Lasciare vuoto se il prezzo non è ancora definito.
      - label: È una specialità della casa
        name: specialita
        widget: boolean
        default: false
        hint: Le specialità vengono messe in evidenza nella pagina.
      - label: Fotografia del piatto
        name: foto
        widget: image
        accept: image/jpeg,image/png,image/webp,image/avif
        required: false
        hint: 'Facoltativa. Se c''è, il piatto compare anche in galleria.'
