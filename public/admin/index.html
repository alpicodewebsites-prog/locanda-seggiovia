<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Gestione contenuti — Locanda Seggiovia</title>

    <!--
      Sveltia CMS — pannello di gestione dei contenuti.

      Non c'è nessun server: il pannello legge e scrive direttamente i file
      Markdown del repository GitHub. Ogni salvataggio è un commit, quindi ogni
      modifica è tracciata e sempre annullabile.

      Per accedere serve un account GitHub con permesso di scrittura sul
      repository indicato in `repo` dentro config.yml.

      IMPORTANTE — non aggiungere un <link> al foglio di stile di Sveltia e non
      mettere `type="module"` sullo script: la libreria se ne occupa da sola e
      segnala entrambe le cose come errori. Lo script va incluso così com'è.
    -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  </head>

  <body>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 2rem; max-width: 40rem">
        Per gestire i contenuti del sito serve JavaScript. Attivare JavaScript in questo
        browser e ricaricare la pagina.
      </p>
    </noscript>
  </body>
</html>
